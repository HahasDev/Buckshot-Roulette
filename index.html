<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./app.js" defer></script>



</head>
<body>
    
  <main class="game-panel">
  <h1>Buckshot Roulette</h1>



  <div class="controls">
    <button class="action-button" id="start" type="button">
      Start Game
    </button>

   
    <button class="action-button" id="open-instructions" type="button">
      How to play
    </button>

  </div>

  <dialog id="instructions">
    <h2>How to play <button class="action-button" id="close-instructions" type="button">
     ❌
    </button></h2>
     
    <p>
        -You have 4 Health points <br>
        -A number of shells will appear for 1 second, make sure to remember<br>
        -Either you shoot at yourself, or your opponent with the hope it is a live shell<br>
        -You will have items to help you drain your oppoent health
    </p>
       

  </dialog>



</main>
<section class = "game-panel" id="game-started" hidden>
  <button class="action-button" id="shootPlayer" type="button">
    Shoot yourself
  </button>
  <button class="action-button" id="shootDealer" type="button">
   Shoot Dealer
  </button>
  <button class="action-button" id="takePill" type="button">
   Pill
  </button>

   <button class="action-button" id="handcuff" type="button">
   Handcuff
  </button>

   <button class="action-button" id="handSaw" type="button">
   Hand Saw
  </button>

   <button class="action-button" id="magnifier" type="button">
   Magnifier
  </button>
</section>
</body>
</html>
